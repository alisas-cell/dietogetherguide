name: Verify Vercel Preview

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Vercel Preview URL to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright preview acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Preview acceptance tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
